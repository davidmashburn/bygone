opening:
  title: Start from the change you have
  summary: >-
    Compare files, a directory, or saved revisions, and edit or inspect the text in that view.
    Follow one file through its commits when you want its history. A pull request starts from
    its link and opens that comparison. On a tour, Next stays on one claim. A question, a check,
    or a related explanation stays closed until you open it.
conclusion:
  title: Review, Present, and an authored tour open different paths
  summary: >-
    Review opens the merge base of the pinned destination tip and the fetched head, against that
    head. Present opens a generated tour of that range, and Next walks its overview and file
    scenes. On an authored tour, Next follows its claim, and a question, a check, or a
    related explanation stays closed until you open it. A check records an inspection.
    It does not approve the change, and a test shown on screen was not run.
