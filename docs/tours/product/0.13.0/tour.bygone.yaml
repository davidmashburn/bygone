        0.13.0 source. The opened comparison was not captured. Older screenshots were not recaptured.
    behavior:
      status: partial
      summary: >-
        The capture drove the live reader for the new chapter. It did not execute the sample test
        or rerun the product suite.
    coverage:
      status: partial
      summary: >-
        The new chapters show the reader path, checks, related explanations, and the pull-request
        dialog before submit. A fetched pull request, the opened comparison, and a version 2
        review package are not shown. Narration and revision-impact commands are named, not run.
    uncertainty:
      status: partial
      summary: >-
        Go, Rust, and Mojo graphs, a fresh VS Code session, and hosted publication were not rerun.
