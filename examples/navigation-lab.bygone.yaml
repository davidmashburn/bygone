version: 5
title: Explore a tour without losing your place
windowTitle: Bygone navigation lab
opening:
  title: Leave step 3. Come back to step 3.
  summary: >-
    You pause at a code step to read the chapter overview. Returning should bring you back to that
    step, with its code still in view. Two Bygone commits address those two needs: one remembers the
    return destination; the next prevents layout changes from disturbing it. We’ll follow the saved
    position, then the scroll guard. This tour examines an earlier viewer implementation.
conclusion:
  title: A saved step also needs stable code focus
  summary: >-
    Opening an overview keeps the selected step; returning resumes it before advancing. The URL
    preserves both choices across reload. Separately, the scroll guard prevents layout-only
    notifications from invoking synchronization. The source explains the return path, and callback
    tests check the guard. Neither demonstrates the complete interaction: refresh, return, and
    resize still need a browser check.
