connections: []
chapters:
  - id: reading
    title: Remember where to return
    scenes:
      - id: reading-path
        title: An overview changes the view, not the selected step
        summary: >-
          Suppose you are reading step 3 and open its chapter overview. The viewer needs to change
          what it explains while keeping step 3 as the return destination. We’ll trace that
          separation, then the boundary: choosing a different chapter deliberately selects a new
          destination.
        bullets: []
        tags:
          - navigation-demo
        takeaway: >-
          Opening the current chapter preserves its selection; choosing another chapter starts
          there.
        steps:
          - id: parent-view
            title: Change the view without resetting the selection
            body: >-
              Opening a tour or chapter overview sets narrativeParent and redraws the navigation.
              This branch does not change the active scene or step. Step 3 can therefore remain
              selected while the reader sees its broader context.
            focus: parent-view
          - id: path-children
            title: A different chapter needs a different destination
            body: >-
              The chapter button checks whether it contains the current scene. If it does, the
              selection stays put. If it does not, the button selects that chapter’s first scene at
              step 1 before opening its overview. Preserving your place applies to stepping outward;
              it does not prevent deliberate navigation elsewhere.
            focus: path-children
      - id: return-position
        title: Return to the saved step—even after a reload
        summary: >-
          The selection survives in memory, but it also has to survive returning and reloading.
          Still in the same comparison, follow the two values into the URL, the forward action, and
          startup. Together they explain why an overview need not become a dead end.
        bullets: []
        tags:
          - navigation-demo
        takeaway: Save both the step to resume and the view to show; restoring either alone is insufficient.
        steps:
          - id: remember-step
            title: "Save two facts: where to return, and what to show"
            body: >-
              The URL keeps the selected step while view records the open overview. In our example,
              it needs both “step 3” and “chapter view.” Saving only the chapter would lose the
              return destination; saving only the step would reopen code instead of the overview.
            focus: remember-step
          - id: resume-parent
            title: Resume step 3 before considering step 4
            body: >-
              The forward action checks for a parent view before normal advancement. It opens the
              saved scene and step, then returns immediately. From the chapter overview, that means
              resume step 3—not skip ahead to step 4.
            focus: resume-parent
          - id: restore-parent
            title: Reload the destination, then reopen the overview
            body: >-
              Startup first resolves the scene and step from the URL and selects them. Only then
              does it apply the parent view. That order restores a return destination underneath the
              overview. The code establishes this sequence; a reload-and-return interaction remains
              the browser check.
            focus: restore-parent
  - id: evidence
    title: Keep that code in view
    scenes:
      - id: marker-focus
        title: A resize notification is not necessarily a scroll
        summary: >-
          A saved step is not enough if resizing the panels moves its highlighted code off-screen.
          Monaco can report a changed scrollable area even when the scroll position stays put. The
          old handler could synchronize that notification. This scene follows the new guard and
          checks that real scrolling still works.
        bullets: []
        tags:
          - navigation-demo
        takeaway: >-
          A change in scrollable size needs a redraw; an unsuppressed position change still needs
          synchronization.
        steps:
          - id: ignore-layout
            title: Redraw layout changes without moving the other panels
            body: >-
              The new condition asks whether either scroll position changed. If neither did, it
              redraws the lines connecting matching code and returns before synchronization.
              Existing event suppression also takes this early exit. Unsuppressed movement still
              reaches the synchronizer, so fixing the resize case does not require disabling linked
              scrolling.
            focus: ignore-layout
          - id: width-test
            title: A wider scrollable area must not move the code
            body: >-
              The test changes the scrollable width while leaving both position flags false. It
              expects only a connector redraw. Calling a synchronizer here would reopen the route by
              which layout changes can disturb a code reveal.
            focus: width-test
          - id: real-scroll-tests
            title: Real movement must still keep panels together
            body: >-
              Skipping synchronization for every scroll event would pass the previous check but
              break linked scrolling. These assertions rule that out: vertical movement in two-panel
              mode and horizontal movement in multi-panel mode each synchronize, then redraw. Panel
              mode selects the synchronizer; the direction of movement does not. These tests check
              callback routing, not on-screen marker visibility.
            focus: real-scroll-tests
