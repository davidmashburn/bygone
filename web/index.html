<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bygone Tour</title>
    <link href="/media/webview.css" rel="stylesheet">
    <link href="/web/presenter.css" rel="stylesheet">
</head>
<body class="web-host">
    <aside id="tour-shell" class="tour-shell" hidden>
        <header class="tour-overview">
            <button id="tour-sidebar-hide" class="tour-sidebar-hide" type="button" title="Hide tour sidebar" aria-label="Hide tour sidebar">‹</button>
            <h1 id="tour-title"></h1>
            <a id="tour-source" class="tour-source" target="_blank" rel="noreferrer" hidden>Open source ↗</a>
            <div class="tour-meta">
                <div id="tour-range" class="tour-range"></div>
                <div id="tour-stats" class="tour-stats"></div>
            </div>
        </header>
        <section class="tour-search" aria-label="Search tour">
            <div class="tour-search-controls">
                <input id="tour-search-input" type="search" placeholder="Search tour" aria-label="Search tour narrative and code">
                <select id="tour-search-scope" aria-label="Tour search scope" title="Tour search scope">
                    <option value="all">Narrative + code</option>
                    <option value="narrative">Narrative</option>
                    <option value="code">Code</option>
                </select>
            </div>
            <div id="tour-search-status" class="tour-search-status" role="status" aria-live="polite"></div>
            <div id="tour-search-results" class="tour-search-results" role="listbox"></div>
        </section>
        <div class="tour-rail-sections">
            <section class="tour-rail-section">
                <header class="tour-rail-heading">
                    <span>Tour</span>
                    <span id="tour-scene-count" class="tour-rail-count"></span>
                </header>
                <nav id="tour-scenes" class="tour-scenes" aria-label="Change tour scenes"></nav>
            </section>
            <section class="tour-rail-section tour-files-section">
                <header class="tour-rail-heading">
                    <span>Files</span>
                    <span id="tour-file-count" class="tour-rail-count"></span>
                    <button id="tour-return-focus" class="tour-return-focus" type="button" title="Return to the file focused by the current tour step" hidden>Return to tour</button>
                </header>
                <nav id="tour-files" class="tour-files" aria-label="Changed files"></nav>
            </section>
        </div>
        <details class="tour-commits-section">
            <summary id="tour-commits-summary">0 commits</summary>
            <ol id="tour-commits" class="tour-commits"></ol>
        </details>
        <div id="tour-sidebar-resizer" class="tour-sidebar-resizer" role="separator" aria-label="Resize tour sidebar" title="Resize tour sidebar (Left/Right; Home/End)" aria-orientation="vertical" aria-valuemin="240" aria-valuemax="600" tabindex="0"></div>
    </aside>
    <button id="tour-sidebar-show" class="tour-sidebar-show" type="button" title="Show tour sidebar" aria-label="Show tour sidebar" hidden>›</button>
    <section id="tour-narrative" class="tour-narrative" hidden>
        <nav class="tour-narrative-nav" aria-label="Tour navigation">
            <button id="tour-previous" type="button" title="Previous tour item (Left or Page Up)">← Prev</button>
            <span id="tour-breadcrumb" class="tour-breadcrumb"></span>
            <button id="tour-next" type="button" title="Next tour item (Right or Page Down)">Next →</button>
        </nav>
        <div id="tour-narration-controls" class="tour-narration-controls" role="group" aria-label="Tour narration">
            <div class="tour-narration-transport" role="group" aria-label="Narration playback">
                <button id="tour-narration-skip-back" type="button" title="Previous sentence" aria-label="Previous sentence" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
                <button id="tour-listen" type="button" title="Listen from the current tour item" aria-label="Listen from the current tour item">
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="tour-icon-fill tour-play-pause-icon" d="m8 5 11 7-11 7Z"/></svg>
                </button>
                <button id="tour-stop" type="button" title="Stop narration" aria-label="Stop narration" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="tour-icon-fill" d="M6 6h12v12H6z"/></svg>
                </button>
                <button id="tour-narration-skip-ahead" type="button" title="Next sentence" aria-label="Next sentence" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                </button>
            </div>
            <div class="tour-narration-settings">
                <select id="tour-narration-voice" aria-label="Narration voice" title="Narration voice" disabled>
                    <option value="">System default voice</option>
                </select>
                <select id="tour-narration-rate" aria-label="Narration speed" title="Narration speed">
                    <option value="0.75">0.75×</option>
                    <option value="1">1×</option>
                    <option value="1.25">1.25×</option>
                    <option value="1.5">1.5×</option>
                </select>
            </div>
            <span id="tour-narration-status" class="tour-narration-status" role="status" aria-live="polite" aria-atomic="true">Device voice ready</span>
        </div>
        <div class="tour-narrative-layout">
            <div class="tour-narrative-prose">
                <div id="tour-narrative-chapter" class="tour-narrative-chapter"></div>
                <h2 id="tour-narrative-title"></h2>
                <p id="tour-narrative-summary" class="tour-narrative-summary"></p>
                <ul id="tour-narrative-bullets" class="tour-narrative-bullets"></ul>
                <div id="tour-narrative-tags" class="tour-narrative-tags"></div>
            </div>
            <div class="tour-narrative-side">
                <div id="tour-step" class="tour-step" hidden>
                    <div id="tour-step-title" class="tour-step-title"></div>
                    <p id="tour-step-body" class="tour-step-body"></p>
                    <div id="tour-connection" class="tour-connection" hidden></div>
                </div>
                <div id="tour-narrative-takeaway" class="tour-narrative-takeaway"></div>
            </div>
        </div>
    </section>
    <div id="tour-narrative-resizer" class="tour-narrative-resizer" role="separator" aria-label="Resize tour header" title="Resize tour header (Up/Down; Home/End)" aria-orientation="horizontal" aria-valuemin="180" tabindex="0"></div>
    <div class="web-toolbar">
        <div class="web-toolbar-group">
            <button id="web-compare-test" type="button" title="Compare sample files">Compare Test Files</button>
            <button id="web-open-diff" type="button" title="Choose two files to compare">Open 2 Files</button>
            <button id="web-open-diff3" type="button" title="Choose one or more files">Open Files</button>
        </div>
        <div id="web-status" class="web-status" role="status" aria-live="polite" aria-atomic="true">Browser host ready.</div>
    </div>

    <input id="web-diff-input" type="file" multiple hidden>
    <input id="web-diff3-input" type="file" multiple hidden>

    <div id="container">
        <div id="header">
            <div id="file-info" class="header-align-diff">Choose a compare command to render a diff.</div>
            <div id="status-banner" class="status-banner header-align-diff" role="status" aria-live="polite" aria-atomic="true" hidden></div>
            <div id="directory-return-toolbar" class="directory-return-toolbar header-align-diff" hidden>
                <button id="back-to-directory" class="directory-return-button" type="button" title="Back to directory view (Cmd/Ctrl+[)">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M15 18l-6-6 6-6"></path>
                        <path d="M9 12h10"></path>
                    </svg>
                    <span>Back</span>
                </button>
                <button id="toggle-directory-sidebar" class="directory-return-button" type="button" title="Hide directory files" aria-label="Hide directory files" aria-pressed="true">
                    <span>Files</span>
                </button>
            </div>
            <div id="edit-mode-toolbar" class="edit-mode-toolbar header-align-diff" hidden>
                <button id="toggle-readonly" class="edit-mode-button" type="button" title="Toggle read-only mode">Editing On</button>
            </div>
            <div id="change-toolbar" class="change-toolbar header-align-diff" hidden>
                <div class="change-toolbar-main">
                    <div class="change-toolbar-nav">
                        <button id="previous-file" class="change-button icon-button" type="button" title="Open previous file" data-tooltip="Open previous file" aria-label="Previous file">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M17 11l-5-5-5 5"></path>
                                <path d="M17 18l-5-5-5 5"></path>
                            </svg>
                        </button>
                        <button id="next-file" class="change-button icon-button" type="button" title="Open next file" data-tooltip="Open next file" aria-label="Next file">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M7 13l5 5 5-5"></path>
                                <path d="M7 6l5 5 5-5"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="change-toolbar-center">
                        <button id="previous-change" class="change-button icon-button" type="button" title="Previous difference (Shift+F7 or Cmd/Ctrl+Shift+Up)" aria-label="Previous difference">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 19V5"></path>
                                <path d="M6 11l6-6 6 6"></path>
                            </svg>
                        </button>
                        <button id="copy-left-to-right" class="change-button change-button-primary icon-button" type="button" title="Copy current change from left to right (Cmd/Ctrl+Alt+Right)" aria-label="Copy current change from left to right">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5 12h10"></path>
                                <path d="M11 8l4 4-4 4"></path>
                                <path d="M19 5v14"></path>
                            </svg>
                        </button>
                        <div id="change-position" class="change-position" role="status" aria-live="polite" aria-atomic="true"></div>
                        <button id="copy-right-to-left" class="change-button change-button-primary icon-button" type="button" title="Copy current change from right to left (Cmd/Ctrl+Alt+Left)" aria-label="Copy current change from right to left">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M19 12H9"></path>
                                <path d="M13 8l-4 4 4 4"></path>
                                <path d="M5 5v14"></path>
                            </svg>
                        </button>
                        <button id="next-change" class="change-button change-button-primary icon-button" type="button" title="Next difference (F7 or Cmd/Ctrl+Shift+Down)" aria-label="Next difference">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 5v14"></path>
                                <path d="M6 13l6 6 6-6"></path>
                            </svg>
                        </button>
                    </div>
                    <div class="change-toolbar-actions">
                    <button id="toggle-word-wrap" class="change-button icon-button" type="button" title="Enable line wrapping (Alt+Z)" aria-label="Enable line wrapping" aria-pressed="false" hidden>
                        <svg class="word-wrap-icon-off" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 6h13a3 3 0 0 1 0 6H9"></path>
                            <path d="M12 9l-3 3 3 3"></path>
                            <path d="M4 18h8"></path>
                            <path d="M5 4l14 16"></path>
                        </svg>
                        <svg class="word-wrap-icon-on" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M4 6h13a3 3 0 0 1 0 6H9"></path>
                            <path d="M12 9l-3 3 3 3"></path>
                            <path d="M4 18h8"></path>
                        </svg>
                    </button>
                    <button id="refresh-session" class="change-button refresh-session-button icon-button" type="button" title="Refresh Session (Cmd/Ctrl+R)" aria-label="Refresh Session" disabled>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M20 11a8 8 0 1 0-2.3 5.7"></path>
                            <path d="M20 5v6h-6"></path>
                        </svg>
                    </button>
                    </div>
                </div>
                <div class="change-hint">F7 / Shift+F7 · Cmd/Ctrl+Shift+Up/Down to jump.</div>
            </div>
            <div id="history-toolbar" class="history-toolbar header-align-diff" hidden>
                <div class="history-side history-side-left">
                    <div id="history-left-commit" class="history-commit"></div>
                    <div id="history-left-time" class="history-time"></div>
                </div>
                <div class="history-nav">
                    <button id="history-back" class="history-button icon-button" type="button" title="Open older commit" data-tooltip="Open older commit" aria-label="Older commit">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M15 18l-6-6 6-6"></path>
                            <path d="M10 18l-6-6 6-6" opacity="0.7"></path>
                        </svg>
                    </button>
                    <div id="history-position" class="history-position" role="status" aria-live="polite" aria-atomic="true"></div>
                    <button id="history-forward" class="history-button icon-button" type="button" title="Open newer commit" data-tooltip="Open newer commit" aria-label="Newer commit">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M9 18l6-6-6-6"></path>
                            <path d="M14 18l6-6-6-6" opacity="0.7"></path>
                        </svg>
                    </button>
                    <button id="history-toggle-staged" class="history-button history-toggle-button" type="button" title="Include staged changes in history" aria-label="Include staged changes in history" aria-pressed="false">
                        Staged
                    </button>
                    <button id="history-toggle-skip-unchanged" class="history-button history-toggle-button" type="button" title="Skip revisions where the current file did not change" aria-label="Skip revisions where the current file did not change" aria-pressed="false">
                        Changed
                    </button>
                </div>
                <div class="history-side history-side-right">
                    <div id="history-right-commit" class="history-commit"></div>
                    <div id="history-right-time" class="history-time"></div>
                </div>
            </div>
            <div id="directory-tree-toolbar" class="directory-tree-toolbar header-align-diff" hidden>
                <button id="directory-expand-all" class="directory-tree-button icon-button" type="button" title="Expand all folders" aria-label="Expand all folders">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 7h16"></path>
                        <path d="M4 12h16"></path>
                        <path d="M4 17h16"></path>
                        <path d="M12 4v16"></path>
                    </svg>
                </button>
                <button id="directory-collapse-all" class="directory-tree-button icon-button" type="button" title="Collapse all folders" aria-label="Collapse all folders">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 7h16"></path>
                        <path d="M4 12h16"></path>
                        <path d="M4 17h16"></path>
                    </svg>
                </button>
                <button id="directory-collapse-unchanged" class="directory-tree-button icon-button" type="button" title="Collapse unchanged folders" aria-label="Collapse unchanged folders">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 7h16"></path>
                        <path d="M4 12h10"></path>
                        <path d="M4 17h16"></path>
                        <path d="M17 9l3 3-3 3"></path>
                    </svg>
                </button>
            </div>
        </div>
        <div id="diff-workspace">
            <aside id="history-rail" class="history-rail hidden" hidden></aside>
            <button id="show-navigation-sidebar" class="navigation-sidebar-show" type="button" title="Show navigation sidebar" aria-label="Show navigation sidebar" hidden>›</button>
            <div id="diff-container">
                <div id="two-way-diff" class="diff-view">
                    <div class="file-panel">
                        <button id="file1-header" class="file-header" type="button" title="Select left pane" aria-pressed="false">File 1</button>
                        <div id="file1-content" class="file-content"></div>
                    </div>
                    <div class="file-panel">
                        <button id="file2-header" class="file-header" type="button" title="Select right pane" aria-pressed="false">File 2</button>
                        <div id="file2-content" class="file-content"></div>
                    </div>
                </div>
                <div id="directory-diff" class="dir-view hidden">
                    <div class="dir-headers">
                        <div class="dir-col-header" id="dir-left-header">Left</div>
                        <div class="dir-header-gutter" aria-hidden="true"></div>
                        <div class="dir-col-header" id="dir-right-header">Right</div>
                    </div>
                    <div id="dir-rows" class="dir-rows-container"></div>
                </div>
                <div id="multi-way-diff" class="multi-view hidden"></div>
                <div id="three-way-diff" class="diff-view hidden">
                    <div class="file-panel">
                        <div id="base-header" class="file-header">Base</div>
                        <div id="base-content" class="file-content"></div>
                    </div>
                    <div class="file-panel">
                        <div id="left-header" class="file-header">Left</div>
                        <div id="left-content" class="file-content"></div>
                    </div>
                    <div class="file-panel">
                        <div id="right-header" class="file-header">Right</div>
                        <div id="right-content" class="file-content"></div>
                    </div>
                    <div class="file-panel">
                        <div id="result-header" class="file-header">Result</div>
                        <div id="result-content" class="file-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/web/web-host.js"></script>
    <script src="/media/webview.js"></script>
</body>
</html>
