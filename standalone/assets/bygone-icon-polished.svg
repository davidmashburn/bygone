<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Bygone</title>
  <desc id="desc">Side-by-side diff icon: two panels of text lines with green and blue change bands connected through the gutter.</desc>
  <defs>
    <linearGradient id="bgFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202940"/>
      <stop offset="1" stop-color="#0c101b"/>
    </linearGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222b3e"/>
      <stop offset="1" stop-color="#151b29"/>
    </linearGradient>
    <linearGradient id="grayBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d586c"/>
      <stop offset="1" stop-color="#3a4354"/>
    </linearGradient>
    <linearGradient id="greenBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#36b14d"/>
      <stop offset="1" stop-color="#268c3c"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63e97e"/>
      <stop offset="1" stop-color="#41d160"/>
    </linearGradient>
    <linearGradient id="blueBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#1e55c2"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#85b5ff"/>
      <stop offset="1" stop-color="#5e90f7"/>
    </linearGradient>
    <filter id="bandGlow" x="-0.08" y="-0.4" width="1.16" height="1.8">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bgFill)"/>
  <rect x="5" y="5" width="1014" height="1014" rx="220" fill="none" stroke="#39465e" stroke-width="2" opacity="0.6"/>

  <rect id="left-panel" x="88" y="144" width="368" height="768" rx="44" fill="url(#panelFill)" stroke="#39465e" stroke-width="3"/>
  <rect id="right-panel" x="568" y="144" width="364" height="768" rx="44" fill="url(#panelFill)" stroke="#39465e" stroke-width="3"/>

  <g id="top-green">
    <path d="M88 192 H456 H568 H932 V288 H568 C468 288 556 192 456 192 H88 Z" fill="url(#greenBand)" filter="url(#bandGlow)" opacity="0.55"/>
    <path d="M88 192 H456 H568 H932 V288 H568 C468 288 556 192 456 192 H88 Z" fill="url(#greenBand)"/>
    <path d="M88 192 H456 H568 H932" fill="none" stroke="#7be98f" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M932 288 H568 C468 288 556 192 456 192 H88" fill="none" stroke="#7be98f" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g id="blue">
    <path d="M88 384 H456 C556 384 468 480 568 480 H932 V672 H568 H456 H88 Z" fill="url(#blueBand)" filter="url(#bandGlow)" opacity="0.55"/>
    <path d="M88 384 H456 C556 384 468 480 568 480 H932 V672 H568 H456 H88 Z" fill="url(#blueBand)"/>
    <path d="M88 384 H456 C556 384 468 480 568 480 H932" fill="none" stroke="#8fb6ff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M932 672 H568 H456 H88" fill="none" stroke="#8fb6ff" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g id="bottom-green">
    <path d="M88 768 H456 H568 H932 V768 H568 C468 768 556 864 456 864 H88 Z" fill="url(#greenBand)" filter="url(#bandGlow)" opacity="0.55"/>
    <path d="M88 768 H456 H568 H932 V768 H568 C468 768 556 864 456 864 H88 Z" fill="url(#greenBand)"/>
    <path d="M88 768 H456 H568 H932" fill="none" stroke="#7be98f" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M932 768 H568 C468 768 556 864 456 864 H88" fill="none" stroke="#7be98f" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  </g>

  <g id="left-bars">
    <rect x="126" y="214" width="292" height="52" rx="26" fill="url(#grayBar)"/>
    <rect x="126" y="310" width="292" height="52" rx="26" fill="url(#grayBar)"/>
    <rect x="126" y="406" width="292" height="52" rx="26" fill="url(#blueBar)"/>
    <rect x="126" y="502" width="292" height="52" rx="26" fill="url(#blueBar)"/>
    <rect x="126" y="598" width="292" height="52" rx="26" fill="url(#blueBar)"/>
    <rect x="126" y="694" width="292" height="52" rx="26" fill="url(#grayBar)"/>
    <rect x="126" y="790" width="292" height="52" rx="26" fill="url(#greenBar)"/>
  </g>
  <g id="right-bars">
    <rect x="606" y="214" width="288" height="52" rx="26" fill="url(#greenBar)"/>
    <rect x="606" y="310" width="288" height="52" rx="26" fill="url(#grayBar)"/>
    <rect x="606" y="406" width="288" height="52" rx="26" fill="url(#grayBar)"/>
    <rect x="606" y="502" width="288" height="52" rx="26" fill="url(#blueBar)"/>
    <rect x="606" y="598" width="288" height="52" rx="26" fill="url(#blueBar)"/>
    <rect x="606" y="694" width="288" height="52" rx="26" fill="url(#grayBar)"/>
  </g>
</svg>
