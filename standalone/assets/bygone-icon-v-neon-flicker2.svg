      <rect x="382" y="402" width="14" height="56" rx="7" fill="#9cc4ff" opacity="0.75" filter="url(#hotGlow)"/>
      <rect x="386" y="407" width="6" height="46" rx="3" fill="#e8f3ff" opacity="0.95"/>
    </g>
    <rect x="120" y="497" width="316" height="50" rx="25" fill="#6da4ff"/>
    <rect x="120" y="589" width="316" height="50" rx="25" fill="#6da4ff"/>
    <rect x="120" y="681" width="316" height="50" rx="25" fill="#363e4e"/>
    <rect x="120" y="773" width="316" height="50" rx="25" fill="#52ff8d"/>
  </g>
  <g id="right-bars">
    <rect x="588" y="221" width="316" height="50" rx="25" fill="#52ff8d"/>
    <rect x="588" y="313" width="316" height="50" rx="25" fill="#363e4e"/>
    <rect x="588" y="405" width="316" height="50" rx="25" fill="#363e4e"/>
    <rect x="588" y="497" width="316" height="50" rx="25" fill="#6da4ff"/>
    <clipPath id="clip-right-4"><rect x="588" y="589" width="316" height="50" rx="25"/></clipPath>
    <g id="flicker-right-4">
      <rect x="588" y="589" width="316" height="50" rx="25" fill="#1c2536" stroke="#33415c" stroke-width="2"/>
