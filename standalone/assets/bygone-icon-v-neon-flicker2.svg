    <rect x="120" y="497" width="316" height="50" rx="25" fill="#6da4ff" opacity="0.55" filter="url(#pillGlow)"/>
    <rect x="120" y="589" width="316" height="50" rx="25" fill="#6da4ff" opacity="0.55" filter="url(#pillGlow)"/>
    <rect x="120" y="773" width="316" height="50" rx="25" fill="#52ff8d" opacity="0.55" filter="url(#pillGlow)"/>
    <rect x="588" y="221" width="316" height="50" rx="25" fill="#52ff8d" opacity="0.55" filter="url(#pillGlow)"/>
    <rect x="588" y="497" width="316" height="50" rx="25" fill="#6da4ff" opacity="0.55" filter="url(#pillGlow)"/>
    <rect x="588" y="589" width="196" height="50" rx="25" fill="#6da4ff" opacity="0.45" filter="url(#pillGlow)"/>
  </g>
  <g id="left-bars">
    <rect x="120" y="221" width="316" height="50" rx="25" fill="#363e4e"/>
    <rect x="120" y="313" width="316" height="50" rx="25" fill="#363e4e"/>
    <clipPath id="clip-left-2"><rect x="120" y="405" width="316" height="50" rx="25"/></clipPath>
    <g id="flicker-left-2">
