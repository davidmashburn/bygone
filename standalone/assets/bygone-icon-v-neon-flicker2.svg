      <rect x="777" y="586" width="14" height="56" rx="7" fill="#9cc4ff" opacity="0.75" filter="url(#hotGlow)"/>
      <rect x="781" y="591" width="6" height="46" rx="3" fill="#e8f3ff" opacity="0.95"/>
    </g>
    <rect x="588" y="681" width="316" height="50" rx="25" fill="#363e4e"/>
