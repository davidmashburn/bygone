      <path d="M920 752 H572 C468 752 556 844 452 844 H104" fill="none" stroke="#52ff8d" stroke-width="9" stroke-linecap="round"/>
    </g>
    <path d="M104 752 H452 H572 H920" fill="none" stroke="#eafff1" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M920 752 H572 C468 752 556 844 452 844 H104" fill="none" stroke="#eafff1" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>

  <g id="pill-glows">
