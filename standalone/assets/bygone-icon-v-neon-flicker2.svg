<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">Bygone — neon flicker x2</title>
  <desc id="desc">Panel-less neon take: floating pills and glowing connector bands.</desc>
  <defs>
    <radialGradient id="bgFill" cx="0.5" cy="0.42" r="0.85">
      <stop offset="0" stop-color="#121826"/>
      <stop offset="1" stop-color="#04060b"/>
    </radialGradient>
    <linearGradient id="litBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e97ff"/>
      <stop offset="0.8" stop-color="#85b4ff"/>
      <stop offset="1" stop-color="#a9ccff"/>
    </linearGradient>
    <linearGradient id="afterGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6da4ff" stop-opacity="0.4"/>
      <stop offset="0.45" stop-color="#6da4ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6da4ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="bigGlow" x="-0.15" y="-0.8" width="1.3" height="2.6">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="edgeGlow" x="-0.1" y="-0.5" width="1.2" height="2">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="pillGlow" x="-0.2" y="-0.6" width="1.4" height="2.2">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="hotGlow" x="-1.5" y="-0.8" width="4" height="2.6">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#bgFill)"/>
  <rect x="5" y="5" width="1014" height="1014" rx="220" fill="none" stroke="#1d2738" stroke-width="2"/>

  <g id="top-green">
    <path d="M104 200 H452 H572 H920 V292 H572 C468 292 556 200 452 200 H104 Z" fill="#1d8f47" opacity="0.42" filter="url(#bigGlow)"/>
    <path d="M104 200 H452 H572 H920 V292 H572 C468 292 556 200 452 200 H104 Z" fill="#1d8f47" opacity="0.5"/>
    <g filter="url(#edgeGlow)">
      <path d="M104 200 H452 H572 H920" fill="none" stroke="#52ff8d" stroke-width="9" stroke-linecap="round"/>
      <path d="M920 292 H572 C468 292 556 200 452 200 H104" fill="none" stroke="#52ff8d" stroke-width="9" stroke-linecap="round"/>
    </g>
    <path d="M104 200 H452 H572 H920" fill="none" stroke="#eafff1" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M920 292 H572 C468 292 556 200 452 200 H104" fill="none" stroke="#eafff1" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>

  <g id="blue">
    <path d="M104 384 H452 C556 384 468 476 572 476 H920 V660 H572 H452 H104 Z" fill="#1e54c0" opacity="0.42" filter="url(#bigGlow)"/>
    <path d="M104 384 H452 C556 384 468 476 572 476 H920 V660 H572 H452 H104 Z" fill="#1e54c0" opacity="0.5"/>
    <g filter="url(#edgeGlow)">
      <path d="M104 384 H452 C556 384 468 476 572 476 H920" fill="none" stroke="#6da4ff" stroke-width="9" stroke-linecap="round"/>
      <path d="M920 660 H572 H452 H104" fill="none" stroke="#6da4ff" stroke-width="9" stroke-linecap="round"/>
    </g>
    <path d="M104 384 H452 C556 384 468 476 572 476 H920" fill="none" stroke="#eafff1" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M920 660 H572 H452 H104" fill="none" stroke="#eafff1" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  </g>

  <g id="bottom-green">
    <path d="M104 752 H452 H572 H920 V752 H572 C468 752 556 844 452 844 H104 Z" fill="#1d8f47" opacity="0.42" filter="url(#bigGlow)"/>
    <path d="M104 752 H452 H572 H920 V752 H572 C468 752 556 844 452 844 H104 Z" fill="#1d8f47" opacity="0.5"/>
    <g filter="url(#edgeGlow)">
