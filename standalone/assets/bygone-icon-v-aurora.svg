    <rect x="606" y="310" width="288" height="52" rx="26" fill="rgba(255,255,255,0.30)"/>
    <rect x="606" y="406" width="288" height="52" rx="26" fill="rgba(255,255,255,0.30)"/>
    <rect x="606" y="502" width="288" height="52" rx="26" fill="url(#blueBar)"/>
    <rect x="606" y="598" width="288" height="52" rx="26" fill="url(#blueBar)"/>
