name: Publish VS Code Extension

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Commit or tag containing the extension version to publish
        required: true
        type: string
      version:
        description: Exact package.json version expected at release_ref
        required: true
        type: string

concurrency:
  group: publish-vscode-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install release dependencies
        run: npm ci

      - name: Verify requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node -e 'const actual = require("./package.json").version; if (actual !== process.env.RELEASE_VERSION) { throw new Error(`Expected ${process.env.RELEASE_VERSION}, found ${actual}`); }'

      - name: Build VSIX
        run: npm run package:vsix

      # OIDC support is merged upstream but is not included in @vscode/vsce
      # 3.9.2. Pin the reviewed merge commit until the next release includes it.
      - name: Check out OIDC-enabled vsce
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: microsoft/vscode-vsce
          ref: c998e2a8604ba07d2b6a364d1742c1bc38e7d8ff
          path: .tools/vsce
          persist-credentials: false

      - name: Build OIDC-enabled vsce
        working-directory: .tools/vsce
        run: |
          npm ci
          npm run build

      - name: Publish through trusted OIDC
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          vsix="bygone-${RELEASE_VERSION}.vsix"
          test -f "$vsix"
          node .tools/vsce/vsce publish --oidc --packagePath "$vsix"
