name: Tour documentation
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the approved public tour site to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: tour-docs
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: node scripts/build-tour-site.cjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
