name: Release

on:
  push:
    tags: ["v*"]

# No long-lived npm token: id-token lets the runner exchange a short-lived OIDC
# credential with npm via trusted publishing. Everything else stays read-only.
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Gated on a protected environment, so a tag push waits for an approval
    # from a required reviewer before anything reaches the registry.
    environment: npm-publish

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing requires a recent npm; the bundled one may predate it.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest

      - name: Verify the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "Releasing $pkg"

      # Provenance cross-checks repository.url against the OIDC claim and rejects
      # the upload if they disagree, which only surfaces at publish time.
      - name: Verify repository.url matches this repository
        run: |
          expected="https://github.com/${GITHUB_REPOSITORY}"
          actual="$(node -p "
            const u = (require('./package.json').repository || {}).url || '';
            u.replace(/^git\+/, '').replace(/\.git$/, '')
          ")"
          if [ "$actual" != "$expected" ]; then
            echo "package.json repository.url is '$actual', expected '$expected'" >&2
            exit 1
          fi
          echo "repository.url OK: $actual"

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: npm run release:check

      - name: Publish
        run: npm publish ./dist/npm-package --access public
